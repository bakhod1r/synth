name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, for the fuzzing job only.
    - cron: '0 3 * * *'

# A second push to the same branch cancels the first: a queue of runs on stale
# commits tells you nothing and delays the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The core's dependencies are a deliberate, short list: two for the
      # engine, and three reference-data modules that answer for phone numbers,
      # devices and mail domains — data nobody can invent correctly. Nothing keeps
      # the list short except this check.
      - name: Dependency budget
        run: |
          deps=$(go list -m all | tail -n +2 | grep -v '^gopkg.in/check.v1' | wc -l)
          echo "core runtime dependencies: $deps"
          go list -m all | tail -n +2
          if [ "$deps" -gt 5 ]; then
            echo "::error::the core library must depend on google/uuid, yaml.v3, phonex, devicex and emailx only"
            exit 1
          fi

      # Seed corpora only: enough to catch a regression on an input that already
      # broke something once. Real fuzzing runs nightly, below.
      - name: Fuzz seed corpus
        run: go test -run='^Fuzz' ./...

      # The hosted demo runs the same generator the library does, so a module
      # that stops compiling for wasm is a broken release, not a broken page.
      - name: Build for WebAssembly
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./wasm

  # Each nested module keeps its own dependencies out of the core, so each is
  # built and tested on its own. A module missing from this list is a module
  # nobody is testing.
  modules:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: CLI, dir: cmd/synth, test: true }
          - { name: MCP server, dir: mcp, test: true }
          - { name: Parquet sink, dir: sink/parquet, test: true }
          - { name: Benchmark comparison, dir: benchcmp, test: false }
          - { name: Data importer, dir: cmd/synthdata, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.dir }}
      - name: Test
        if: matrix.test
        run: go test -race ./...
        working-directory: ${{ matrix.dir }}
      - name: Build
        if: ${{ !matrix.test }}
        run: go build ./...
        working-directory: ${{ matrix.dir }}

  docs:
    name: Diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
        working-directory: scripts
      # A broken mermaid block is not a build failure — it is a red error box on
      # the front page that nobody notices until someone else points at it.
      - name: Render every diagram in the README
        run: npm run check-diagrams
        working-directory: scripts

  pages:
    name: Static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: scripts/build-pages.sh dist/pages
      - name: Check the module answers
        run: node scripts/check-wasm.mjs dist/pages

  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Builds and runs the package's own tests, which drive it through its
      # public exports the way a consumer does.
      - run: scripts/build-npm.sh

  # Fuzzing finds what tests do not, but only if it runs for longer than a pull
  # request should wait. So it runs nightly, and a crasher is uploaded for
  # someone to commit as a seed rather than failing anyone's merge.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzYAMLSpec, FuzzDDL, FuzzOpenAPI, FuzzJSONSchema, FuzzReadSample, FuzzProfile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Fuzz
        run: go test -run='^$' -fuzz=${{ matrix.target }} -fuzztime=5m .
      - name: Keep any crasher
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crasher-${{ matrix.target }}
          path: testdata/fuzz/

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Benchmarks are informational: a shared runner's timings are too noisy to
    # gate a merge on. They run so a large regression is visible in the log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Core
        run: go test -bench=. -benchmem -benchtime=10x -run='^$' ./...
      - name: Against other fakers
        run: go test -bench=. -benchmem -benchtime=10x -run='^$' ./...
        working-directory: benchcmp
