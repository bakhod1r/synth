<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synth</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <button id="togglePalette" class="rail-btn" type="button" data-i18n-title="types">☰</button>
  <div class="brand">
    <span class="logo">Synth</span>
    <span class="tag" data-i18n="tagline"></span>
  </div>
  <div class="head-right">
    <label class="lang">
      <span data-i18n="language"></span>
      <select id="lang">
        <option value="az">Azərbaycan</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="da">Dansk</option>
        <option value="de">Deutsch</option>
        <option value="et">Eesti</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fil">Filipino</option>
        <option value="fr">Français</option>
        <option value="hr">Hrvatski</option>
        <option value="it">Italiano</option>
        <option value="lv">Latviešu</option>
        <option value="lt">Lietuvių</option>
        <option value="hu">Magyar</option>
        <option value="nl">Nederlands</option>
        <option value="nb">Norsk bokmål</option>
        <option value="uz">O‘zbekcha</option>
        <option value="pl">Polski</option>
        <option value="pt">Português</option>
        <option value="ro">Română</option>
        <option value="sk">Slovenčina</option>
        <option value="sl">Slovenščina</option>
        <option value="fi">Suomi</option>
        <option value="sv">Svenska</option>
        <option value="vi">Tiếng Việt</option>
        <option value="tr">Türkçe</option>
        <option value="cs">Čeština</option>
        <option value="el">Ελληνικά</option>
        <option value="bg">Български</option>
        <option value="ru">Русский</option>
        <option value="sr">Српски</option>
        <option value="uk">Українська</option>
        <option value="kk">Қазақша</option>
        <option value="he">עברית</option>
        <option value="ar">العربية</option>
        <option value="fa">فارسی</option>
        <option value="hi">हिन्दी</option>
        <option value="bn">বাংলা</option>
        <option value="th">ไทย</option>
        <option value="ka">ქართული</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </label>
  </div>
</header>

<div id="shell">

  <aside id="palette">
    <h2 data-i18n="types"></h2>
    <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchTypes">
    <p class="legend">
      <span class="dot on"></span><span data-i18n="legendLocalized"></span>
      <span class="dot"></span><span data-i18n="legendGlobal"></span>
    </p>
    <div id="types"></div>
  </aside>

  <main>
    <section id="builder">
      <h2 data-i18n="schema"></h2>

      <div class="settings">
        <label><span data-i18n="tableName"></span><input id="name" value="users"></label>
        <label><span data-i18n="rows"></span><input id="count" type="number" value="1000" min="1"></label>
        <label><span data-i18n="locale"></span><select id="locale"></select></label>
        <label class="seed">
          <span data-i18n="seed"></span>
          <span class="seed-row">
            <input id="seed" type="number" value="42">
            <button id="reseed" type="button" data-i18n-title="reseedHint">⟳</button>
          </span>
        </label>
        <label><span data-i18n="downloadAs"></span>
          <select id="format">
            <option value="csv">CSV</option>
            <option value="jsonl">JSONL</option>
            <option value="sql">SQL</option>
          </select>
        </label>
        <div class="settings-actions">
          <button id="generate" type="button" class="primary">
            <span class="spinner" aria-hidden="true"></span>
            <span id="generateLabel" data-i18n="generate"></span>
          </button>
          <!-- Hidden until there is something to download. A button that
               silently regenerates on every click makes it impossible to tell
               whether you are saving what you just looked at. -->
          <button id="download" type="button" hidden data-i18n="download"></button>
          <button id="copySpec" type="button" data-i18n="copySpec" data-i18n-title="copySpecHint"></button>
        </div>
      </div>
      <p class="hint" data-i18n="seedHint"></p>
      <p id="genStatus" class="hint gen-status" hidden></p>

      <table id="fields">
        <thead>
          <tr>
            <th></th>
            <th data-i18n="colName"></th>
            <th data-i18n="colType"></th>
            <th data-i18n="colOptions"></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="empty" class="hint" data-i18n="emptySchema"></p>

      <!-- Column settings live in a dialog rather than in the row. A type may
           offer none or nine options; laid out inline they crush every label
           to three letters and the row stops being scannable. -->
      <dialog id="colSettings">
        <form method="dialog">
          <header>
            <h2 id="colSettingsTitle"></h2>
            <button value="close" class="icon" data-i18n-title="close">×</button>
          </header>
          <div id="colSettingsBody"></div>
          <footer>
            <button value="close" class="primary" data-i18n="done"></button>
          </footer>
        </form>
      </dialog>

      <button id="add" type="button" class="primary">
        <span aria-hidden="true">＋</span> <span data-i18n="addField"></span>
      </button>
    </section>

    <section id="preview-pane">
      <div class="pane-head">
        <h2 data-i18n="preview"></h2>
        <div class="pane-tools">
          <span id="previewNote" class="hint"></span>
          <div class="toggle" role="group">
            <button id="viewTable" type="button" data-i18n="viewTable"></button>
            <button id="viewStacked" type="button" data-i18n="viewStacked"></button>
          </div>
        </div>
      </div>
      <p id="error" role="alert" hidden></p>
      <div id="preview"></div>
    </section>
  </main>

</div>

<div id="toast" role="status" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
