# staticcheck configuration.
#
# U1000 ("field is unused") is disabled. Several structs here carry a field
# precisely because it must never be read: an unexported field that proves the
# encoder skips it, a struct shape a reflection test walks. staticcheck cannot
# see that the absence of a use *is* the assertion, so it reports every one of
# them, and a linter with six permanent false positives is a linter people stop
# reading.
# ST1003 (initialisms) and ST1020/ST1021 (comment form) fire on names and
# comments that predate this file across the repository. They are excluded
# rather than churned through in a change that is about something else.
checks = ["all", "-U1000", "-ST1003", "-ST1020", "-ST1021"]
